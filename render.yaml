services:
  - type: web
    name: shrutilipi-backend
    runtime: docker
    rootDir: apps/api
    plan: free
    envVars:
      - key: FRONTEND_URL
        value: https://shrutilipi-rho.vercel.app
      - key: DIRECT_ENABLED
        value: "false"
      - key: CHAIN_ORDER
        value: "supadata,serpapi"
      - key: SUPADATA_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
      - key: WEBSHARE_PROXY_HOSTS
        sync: false
