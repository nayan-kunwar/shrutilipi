services:
  - type: web
    name: shrutilipi-backend
    runtime: docker
    rootDir: apps/api
    plan: free
    envVars:
      - key: FRONTEND_URL
        # Comma-separated. The API also hardcodes these production origins
        # (see apps/api/main.py), so this list only ever *adds* origins.
        value: https://shrutilipi.nayankunwar.com,https://shrutilipi-rho.vercel.app
      - key: DIRECT_ENABLED
        value: "false"
      - key: CHAIN_ORDER
        value: "supadata,serpapi"
      # Optional on-demand summary (§9 of docs/operations.md). All three must
      # be set to enable the feature; missing any leaves it off with a clean
      # 503 summary_disabled, and transcripts are unaffected.
      - key: SUMMARY_BASE_URL
        sync: false
      - key: SUMMARY_API_KEY
        sync: false
      - key: SUMMARY_MODEL
        sync: false
      - key: SUPADATA_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
      - key: WEBSHARE_PROXY_HOSTS
        sync: false
